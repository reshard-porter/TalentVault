<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TalentVault{% endblock %} · TalentVault</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#141B2D; --muted:#667085; --line:#E4E7EC;
  --brand:#1F3A5F; --brand-2:#2E5C8A; --accent:#F2A541; --ok:#12805C; --ok-bg:#E3F5EC;
  --warn:#B54708; --warn-bg:#FEF0E3; --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--brand-2);text-decoration:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--brand);color:#C9D6E6;padding:24px 18px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;margin:0 8px 26px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#F7C873);
  display:grid;place-items:center;color:var(--brand);font-weight:800}
.nav a{display:flex;align-items:center;gap:10px;color:#C9D6E6;padding:10px 12px;border-radius:10px;font-weight:500}
.nav a.active,.nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.nav svg{width:18px;height:18px;opacity:.9}
.sidebar .foot{margin-top:auto;font-size:12px;opacity:.7;padding:0 12px}
.main{padding:28px 36px 48px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar h1{font-size:26px;margin:0;letter-spacing:-.02em}
.topbar p{margin:2px 0 0;color:var(--muted)}
.user{display:flex;align-items:center;gap:12px}
.user .chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  padding:6px 14px 6px 6px;border-radius:999px;font-weight:600;font-size:14px}
.user .dot{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;
  font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F9FAFB}
.btn.accent{background:var(--accent);color:var(--brand)}
.btn.accent:hover{background:#F5B661}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{padding:18px 20px}
.stat .label{color:var(--muted);font-size:13px;font-weight:500}
.stat .value{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.stat .hint{font-size:12px;color:var(--ok);font-weight:600}
.filters{display:flex;gap:12px;padding:16px;align-items:center;flex-wrap:wrap}
.field{position:relative;flex:1;min-width:200px}
.field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field input,.field select{padding-left:38px}
input:focus,select:focus{outline:2px solid #BFD3EA;border-color:var(--brand-2)}
.table-card{margin-top:20px;overflow:hidden}
.table-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.table-head h2{font-size:16px;margin:0}
.count{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
  padding:12px 20px;background:#F9FAFB;border-bottom:1px solid var(--line)}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.candidate-row:hover{background:#F8FAFD}
.person{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#E8EEF5;flex:none}
.person a{font-weight:600;color:var(--ink)}
.person a:hover{color:var(--brand-2)}
.sub{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:#EEF3F9;color:var(--brand)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--muted);font-size:14px}
.pager .links{display:flex;gap:8px}
.empty{padding:48px;text-align:center;color:var(--muted)}
/* profile */
.crumbs{color:var(--muted);font-size:14px;margin-bottom:14px}
.profile-hero{display:flex;gap:24px;align-items:center;padding:28px;position:relative;overflow:hidden}
.profile-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:86px;background:linear-gradient(120deg,var(--brand),var(--brand-2))}
.profile-hero .big{width:112px;height:112px;border-radius:50%;border:5px solid #fff;position:relative;box-shadow:var(--shadow);margin-top:30px}
.profile-hero .who{position:relative;margin-top:62px;flex:1}
.profile-hero h1{margin:0;font-size:26px;letter-spacing:-.02em}
.profile-hero .actions{position:relative;margin-top:62px;display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1.35fr;gap:20px;margin-top:20px}
.panel{padding:22px 24px}
.panel h3{margin:0 0 16px;font-size:15px}
dl#profile{margin:0;display:grid;grid-template-columns:120px 1fr;row-gap:14px}
dt{color:var(--muted);font-size:13.5px;font-weight:500}
dd{margin:0;font-weight:600;word-break:break-word}
.preview{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#F2F4F7}
.doc-tile{display:flex;align-items:center;gap:14px;padding:16px;border:1px dashed var(--line);border-radius:12px;margin-bottom:16px}
.doc-icon{width:44px;height:52px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .brand-side{background:radial-gradient(circle at 20% 20%,#2E5C8A 0,#1F3A5F 45%,#14263F 100%);color:#fff;padding:56px;
  display:flex;flex-direction:column;justify-content:space-between}
.login .brand-side h2{font-size:38px;line-height:1.15;letter-spacing:-.03em;max-width:460px;margin:0 0 14px}
.login .brand-side p{color:#C9D6E6;max-width:420px;margin:0}
.faces{display:flex;margin-top:28px}
.faces img{width:46px;height:46px;border-radius:50%;border:3px solid #1F3A5F;margin-left:-10px}
.faces img:first-child{margin-left:0}
.login .form-side{display:grid;place-items:center;padding:40px}
.login form{width:100%;max-width:380px}
.login h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.login label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.login .btn{width:100%;margin-top:24px;padding:12px}
.alert{background:#FEF3F2;color:#B42318;border:1px solid #FECDCA;padding:10px 14px;border-radius:10px;margin-top:16px;font-size:14px}
.demo-note{margin-top:20px;font-size:13px;color:var(--muted);background:#F2F4F7;padding:10px 14px;border-radius:10px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.sidebar{display:none}.stats{grid-template-columns:1fr 1fr}
  .grid2,.login{grid-template-columns:1fr}.login .brand-side{display:none}.main{padding:20px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
{% block page %}
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">T</div>TalentVault</div>
    <nav class="nav">
      <a href="{{ url_for('candidates') }}" class="{{ 'active' if active=='candidates' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Candidates</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Jobs</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Reports</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="foot">Demo portal · all candidates are fictional</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>{% block heading %}{% endblock %}</div>
      <div class="user">
        <div class="chip"><span class="dot">DM</span>Demo Recruiter</div>
        <a href="{{ url_for('logout') }}" id="logout" class="btn ghost">Log out</a>
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
